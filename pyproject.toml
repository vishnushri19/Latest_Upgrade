[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-17-to-21-upgrade-architecture"
version = "0.1.0"
description = "Enterprise-grade upgrade architecture and validation framework for F5 BIG-IP 17.x to 21.x"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

authors = [
  { name = "Vishnu Gatla" }
]

dependencies = [
  "requests>=2.31.0"
]

[tool.setuptools.packages.find]
where = ["src"]
